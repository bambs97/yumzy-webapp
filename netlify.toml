[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/restaurant/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/r/*"
  [headers.values]
    Cache-Control = "no-cache"
